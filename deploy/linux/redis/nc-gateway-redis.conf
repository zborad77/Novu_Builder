# Web Gateway session store – /etc/nc-gateway-redis/redis.conf (0644 root:root, no secrets).
# Started by systemd/nc-gateway-redis.service; separate from the core Redis.
# Holds only nc:bff:* keys (encrypted sessions, user index, locks, rate limits).

# No TCP listener at all; unix socket only, group nc-gw-redis (nc-gateway).
port 0
unixsocket /run/nc-gateway-redis/redis.sock
unixsocketperm 770
protected-mode yes

# ACL from the systemd credential (source /etc/nc-gateway-redis/users.acl, 0600 root).
# default user off; nc-gateway: ~nc:bff:* only, no @dangerous, no pub/sub.
aclfile /run/credentials/nc-gateway-redis.service/users.acl

supervised systemd
daemonize no
logfile ""
loglevel notice

# Snapshots (ciphertext only) so that a restart does not log every user out.
dir /var/lib/nc-gateway-redis
dbfilename sessions.rdb
save 300 1 60 1000
appendonly no
rdbcompression yes

# Sessions and rate limits must never be silently evicted: full = errors = the
# gateway answers 503 (fail closed, contract §3).
maxmemory 128mb
maxmemory-policy noeviction

# Lua (rate limit / locks) with a short leash; clients that hang are dropped.
busy-reply-threshold 1000
timeout 300
tcp-keepalive 0
databases 1
