# Module: deploy/linux/nginx
# Description: Catch-all default_server for ports 80/443 on a dedicated nginx (T5.3)
# Created: 2026-11-10

# NovuConstruct Public Edge – catch-all (default_server) for ports 80/443.
# Installed as /etc/nginx/conf.d/nc-edge-default.conf ONLY on a dedicated nginx
# (NC_NGINX_SHARED=0). On a nginx shared with NovuServer (NC_NGINX_SHARED=1) the
# default server belongs to its owner: this file is not installed and the
# NovuConstruct vhosts answer only their own server_name (T5.3).

# Plain HTTP for unknown host names: ACME challenges and redirect only.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/nc-security-headers.conf;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# Requests for unknown host names are dropped without a response.
server {
    listen 443 ssl http2 default_server;       # same protocol options as every 443 vhost
    listen [::]:443 ssl http2 default_server;
    server_name _;
    include /etc/nginx/snippets/nc-security-headers.conf;
    ssl_certificate     /etc/novuconstruct/tls/fullchain.pem;
    ssl_certificate_key /etc/novuconstruct/tls/privkey.pem;
    return 444;
}
