# NovuConstruct Private Core – zone "gateway" for the Web Gateway (F4 / NC-007),
# TWO-server variant A. Installed as /etc/nginx/conf.d/nc-core-gateway.conf by
# `nc-provision install` on the core when NC_ENABLE_GATEWAY_ZONE=1.
# Single-server variant B uses nc-core-gateway-single.conf instead (never both:
# they define the same upstream).
#
# Every request must carry the gateway's HMAC signature (F3.4); unsigned ones get
# 401 from nc-api@gateway before anything else. nc-proxy-gateway.conf forwards the
# signed headers unchanged and sends no X-Forwarded-For.

upstream nc_api_gateway { server unix:/run/novuconstruct/gateway/api.sock; keepalive 16; }

server {
    listen 10.50.0.1:8200;            # wg-nc; nftables: only the edge peer 10.50.0.2
    server_name _;
    include /etc/nginx/snippets/nc-security-headers.conf;
    access_log /var/log/nginx/nc-gateway-zone.access.log;

    allow 10.50.0.2;                  # edge (gateway) peer – keep in sync with nc-core.nft gateway_peer
    deny  all;

    location /api/v1/ {
        include /etc/nginx/snippets/nc-proxy-gateway.conf;
        proxy_pass http://nc_api_gateway;
    }
    location / { return 404; }
}
