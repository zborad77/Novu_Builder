# NovuConstruct Public Edge – web application app.<domain> (NC-007 etapa 1, §2 and §8).
# Installed as /etc/nginx/conf.d/nc-edge-webapp.conf (http context) by
# `nc-provision install` on edge/single hosts; server_name is set from NC_APP_DOMAIN.
#
#   /          → static SPA (src/frontend dist in /var/www/novuconstruct/app),
#                CSP per SECURITY_ARCHITECTURE §4.7, no 'unsafe-*'
#   /bff/      → Web Gateway (nc-gateway.service, 127.0.0.1:8300)
#   /api/, /docs, /redoc, /openapi.json, /metrics, /admin → 404 (never proxied)
#
# nginx is the gateway's ONLY trusted proxy (NC_BFF_TRUSTED_PROXY=127.0.0.1): it
# OVERWRITES X-Forwarded-For with the TCP peer and drops every X-NC-* contract
# header a client might send (snippets/nc-proxy-bff.conf).
# server_tokens off: nginx/nc-http-common.conf (http context, installed once per host).

upstream nc_gateway {
    server 127.0.0.1:8300;
    keepalive 16;
}

# Coarse, per-address limits in front of the gateway's own Redis limits
# (login IP 20/5 min, session 300/min, IP 600/min; contract §4.6).
limit_req_zone  $binary_remote_addr zone=nc_bff_login:10m rate=12r/m;
limit_req_zone  $binary_remote_addr zone=nc_bff_api:10m   rate=20r/s;
limit_conn_zone $binary_remote_addr zone=nc_bff_conn:10m;

# Content-Security-Policy per location without add_header in any location
# (add_header in a location would drop every inherited header, SA-34):
#   SPA   – exactly SECURITY_ARCHITECTURE §4.7, no 'unsafe-inline'/'unsafe-eval';
#   /bff/ – JSON and file streams never need to run or embed anything.
map $uri $nc_app_csp {
    ~^/bff/  "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; sandbox";
    default  "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
}

# Access log without query strings (SECURITY_ARCHITECTURE §8.5).
log_format nc_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    # "listen ... http2": nginx 1.22 (Debian 12) and 1.24 (Ubuntu 24.04) predate "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.invalid;   # nc-provision: NC_APP_DOMAIN

    # One certificate for NC_DOMAIN + NC_APP_DOMAIN (`nc-provision tls`).
    ssl_certificate     /etc/novuconstruct/tls/fullchain.pem;
    ssl_certificate_key /etc/novuconstruct/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    access_log /var/log/nginx/nc-app.access.log nc_noquery;

    # Headers for every response of this vhost. No location below uses add_header,
    # so nothing overrides (and silently drops) these (SA-34).
    include /etc/nginx/snippets/nc-security-headers.conf;
    add_header Content-Security-Policy $nc_app_csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    root /var/www/novuconstruct/app;
    index index.html;

    # Default body limit: JSON is at most 256 KiB at the gateway (contract §4.2).
    client_max_body_size 256k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    large_client_header_buffers 4 16k;

    # ── never exposed on the edge ────────────────────────────────────────────
    location ^~ /api/          { return 404; }
    location = /api            { return 404; }
    location ^~ /docs          { return 404; }
    location ^~ /redoc         { return 404; }
    location ^~ /openapi.json  { return 404; }
    location ^~ /metrics       { return 404; }
    location ^~ /admin         { return 404; }
    location ^~ /storage/      { return 404; }
    location ~ /\.             { return 404; }

    # ── Web Gateway (BFF) ────────────────────────────────────────────────────
    location = /bff/health {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/nc-proxy-bff.conf;
        proxy_pass http://nc_gateway;
    }

    location = /bff/auth/login {
        limit_req zone=nc_bff_login burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        include /etc/nginx/snippets/nc-proxy-bff.conf;
        proxy_pass http://nc_gateway;
    }

    # Uploads only: POST …/images, POST …/upload* (contract §4.2). The gateway
    # enforces the exact route list and 25 MiB; nginx only lets the body through.
    location ~ ^/bff/api/.+/(images|upload[A-Za-z0-9_-]*)$ {
        client_max_body_size 25m;
        client_body_timeout 120s;
        limit_req zone=nc_bff_api burst=40 nodelay;
        limit_req_status 429;
        limit_conn nc_bff_conn 20;
        include /etc/nginx/snippets/nc-proxy-bff.conf;
        proxy_pass http://nc_gateway;
    }

    # Plain prefix (not ^~), so that the upload regex above is still consulted.
    location /bff/ {
        limit_req zone=nc_bff_api burst=40 nodelay;
        limit_req_status 429;
        limit_conn nc_bff_conn 20;
        include /etc/nginx/snippets/nc-proxy-bff.conf;
        # No URI part: the original request URI goes to the gateway unchanged, so
        # its own path checks (%2F, %5C, %00, dot segments → 404) see the raw path.
        proxy_pass http://nc_gateway;
    }

    # ── SPA (static files) ───────────────────────────────────────────────────
    # Hashed build assets: cache for long. `expires` is not add_header, so the
    # security headers above stay inherited.
    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        expires 365d;
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        expires -1;                     # index.html: always revalidate
        try_files $uri /index.html;
    }
}
