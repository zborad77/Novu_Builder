# NovuConstruct Public Edge – informational website only (F1 decision 1).
# Installed as /etc/nginx/conf.d/nc-edge-public.conf. Login, registration and
# password reset arrive with the gateway in F4; until then NOTHING here reaches
# the core API: every /api, /bff, /admin and unknown path answers 404.

# server_tokens: nginx/nc-http-common.conf (http context, installed once per host).

# Plain HTTP: ACME challenges and redirect only.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# Requests for unknown host names are dropped without a response.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/novuconstruct/tls/fullchain.pem;
    ssl_certificate_key /etc/novuconstruct/tls/privkey.pem;
    return 444;
}

server {
    # "listen ... http2": nginx 1.22 (Debian 12) and 1.24 (Ubuntu 24.04) predate "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.invalid example.invalid;   # replace with the public domain

    ssl_certificate     /etc/novuconstruct/tls/fullchain.pem;
    ssl_certificate_key /etc/novuconstruct/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    include /etc/nginx/snippets/nc-security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    root /var/www/novuconstruct/public;
    index index.html;
    client_max_body_size 16k;          # static site: no uploads

    # Never proxy anything to the core from the edge in this phase.
    location ^~ /api/   { return 404; }
    location ^~ /bff/   { return 404; }
    location ^~ /admin  { return 404; }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
