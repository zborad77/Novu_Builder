# Included in every NovuConstruct server block (add_header is not inherited once a block sets
# its own; SA-34).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# No nginx version in the Server header / error pages. Set per server, not in the
# http context, so that a nginx shared with NovuServer keeps its own setting (T5.3).
server_tokens off;
