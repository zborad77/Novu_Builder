# Common proxy settings for the NovuConstruct core API (unix sockets).
# X-Forwarded-For is OVERWRITTEN with the TCP peer (the WireGuard address of the
# desktop/admin peer), never appended: the client cannot inject earlier hops.
# Zone-identifying headers are not sent; the zone is the upstream process.
proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP         "";
proxy_set_header X-NC-Zone         "";
proxy_set_header X-Novu-Zone       "";
# Gateway contract headers (F3.4) are meaningful only on the gateway socket
# (snippets/nc-proxy-gateway.conf). Desktop/admin peers cannot send them on.
proxy_set_header X-NC-Client-IP     "";
proxy_set_header X-NC-Gateway-Key   "";
proxy_set_header X-NC-Gateway-Ts    "";
proxy_set_header X-NC-Gateway-Nonce "";
proxy_set_header X-NC-Gateway-Sig   "";
proxy_read_timeout 300s;
proxy_send_timeout 60s;
proxy_buffering off;               # SSE streams
client_max_body_size 25m;          # photo uploads; API enforces its own limits
