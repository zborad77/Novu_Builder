# Proxy settings for the GATEWAY zone only (F3.4, docs/security/GATEWAY_CORE_CONTRACT.md).
# The Public Edge gateway signs every request (X-NC-Gateway-* + X-NC-Client-IP);
# core verifies the HMAC and takes the client address only from the signed header.
# nginx therefore passes the contract headers through untouched, sends no
# X-Forwarded-For at all, and must not alter anything the signature covers
# (method, path, query, body, Authorization).
proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Real-IP         "";
proxy_set_header X-NC-Zone         "";
proxy_set_header X-Novu-Zone       "";
proxy_read_timeout 300s;
proxy_send_timeout 60s;
proxy_buffering off;               # SSE streams
proxy_request_buffering on;        # core hashes the whole body before the handler runs
client_max_body_size 26m;          # = NC_GATEWAY_MAX_BODY_BYTES
