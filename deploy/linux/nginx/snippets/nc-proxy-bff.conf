# Edge nginx → Web Gateway (nc-gateway, 127.0.0.1:8300). NC-007 §4.7.
# nginx is the gateway's only trusted proxy (NC_BFF_TRUSTED_PROXY=127.0.0.1):
#   * X-Forwarded-For is OVERWRITTEN with the TCP peer (one value, never appended),
#     so a client cannot inject earlier hops; the gateway uses its last value;
#   * every gateway↔core contract header and zone header a client might send is
#     cleared here (the gateway also never forwards them; defence in depth);
#   * Forwarded / X-Real-IP are not sent at all.
proxy_http_version 1.1;
proxy_set_header Connection         "";
proxy_set_header Host               $host;
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header X-Forwarded-Proto  https;
proxy_set_header X-Forwarded-Host   "";
proxy_set_header Forwarded          "";
proxy_set_header X-Real-IP          "";
proxy_set_header X-NC-Zone          "";
proxy_set_header X-Novu-Zone        "";
proxy_set_header X-NC-Client-IP     "";
proxy_set_header X-NC-Gateway-Key   "";
proxy_set_header X-NC-Gateway-Ts    "";
proxy_set_header X-NC-Gateway-Nonce "";
proxy_set_header X-NC-Gateway-Sig   "";
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 310s;           # > NC_BFF_SSE_IDLE_TIMEOUT_SECONDS (300 s) and NC_BFF_CORE_TIMEOUT_SECONDS (110 s)
proxy_buffering off;               # file streams (Range) and SSE pass straight through
proxy_request_buffering on;        # slow clients are absorbed by nginx, not the gateway
proxy_intercept_errors off;        # gateway errors are already generic JSON
