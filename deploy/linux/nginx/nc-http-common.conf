# http-context settings shared by the NovuConstruct vhosts; installed once per host
# as /etc/nginx/conf.d/00-nc-http-common.conf.
#
# Intentionally without directives (T5.3): nginx may be shared with NovuServer, and
# an http-level directive here would change (or, if set twice, break) its vhosts.
# server_tokens off moved to snippets/nc-security-headers.conf (server level).
# The file stays so that `nc-provision install` replaces the managed copy of older
# versions (which still set server_tokens globally) with this neutral content.
