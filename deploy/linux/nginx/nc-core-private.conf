# NovuConstruct Private Core – nginx vhosts bound to WireGuard addresses only.
# Installed as /etc/nginx/conf.d/nc-core-private.conf (http context).
#
# Nothing here listens on a public address. nftables admits each port only from
# the peers allowed to use it; the allow/deny lists below are a second layer.
# The zone is the upstream *process* (unix socket of nc-api@<zone>); no header
# selects it. Unknown paths are answered 404 by the API's exposure guard.

# server_tokens off: snippets/nc-security-headers.conf (per server, T5.3).

upstream nc_api_desktop { server unix:/run/novuconstruct/desktop/api.sock; keepalive 16; }
upstream nc_api_admin   { server unix:/run/novuconstruct/admin/api.sock;   keepalive 4; }

# ── Desktop zone: enrolled desktop peers on wg-nc ────────────────────────────
server {
    listen 10.50.0.1:8210;
    server_name _;
    include /etc/nginx/snippets/nc-security-headers.conf;
    access_log /var/log/nginx/nc-desktop.access.log;

    allow 10.50.16.0/20;
    deny  all;

    location /api/v1/ {
        include /etc/nginx/snippets/nc-proxy.conf;
        proxy_pass http://nc_api_desktop;
    }
    location / { return 404; }
}

# ── Admin zone: NovuAdmin / monitoring peers on wg-nc-admin ──────────────────
server {
    listen 10.51.0.1:8220;
    server_name _;
    include /etc/nginx/snippets/nc-security-headers.conf;
    access_log /var/log/nginx/nc-admin.access.log;

    allow 10.51.0.5;            # monitoring
    allow 10.51.0.10;           # administrator peers: keep in sync with nftables admin_peers
    allow 10.51.0.11;
    deny  all;

    location /api/v1/ {
        include /etc/nginx/snippets/nc-proxy.conf;
        proxy_pass http://nc_api_admin;
    }
    location / { return 404; }
}

# ── Gateway zone (F4 / NC-007) ───────────────────────────────────────────────
# Not here: nc-core-gateway.conf (variant A, 10.50.0.1:8200) or
# nc-core-gateway-single.conf (variant B, 127.0.0.1:8200), installed by
# `nc-provision install` only with NC_ENABLE_GATEWAY_ZONE=1.
