# NovuConstruct Private Core – zone "gateway" for the Web Gateway (F4 / NC-007),
# SINGLE-server variant B (pilot). Installed as /etc/nginx/conf.d/nc-core-gateway.conf
# by `nc-provision install` when NC_VARIANT=single and NC_ENABLE_GATEWAY_ZONE=1.
#
# There is no WireGuard hop between gateway and core on one host
# (WG_NETWORK_DESIGN §6.2), so the compensating controls are:
#   * loopback listener only (never a public or WG address);
#   * nftables (nc-single-server.nft): new connections to 127.0.0.1:8200 only from
#     uid nc-gateway (and root for smoke tests);
#   * nc-gateway.service: IPAddressAllow=127.0.0.1 10.50.0.1, AF_UNIX/AF_INET only,
#     core paths and sockets masked;
#   * HMAC signature on every request (401 without it), as in variant A.

upstream nc_api_gateway { server unix:/run/novuconstruct/gateway/api.sock; keepalive 16; }

server {
    listen 127.0.0.1:8200;
    server_name _;
    include /etc/nginx/snippets/nc-security-headers.conf;
    access_log /var/log/nginx/nc-gateway-zone.access.log;

    allow 127.0.0.1;
    deny  all;

    location /api/v1/ {
        include /etc/nginx/snippets/nc-proxy-gateway.conf;
        proxy_pass http://nc_api_gateway;
    }
    location / { return 404; }
}
