# /etc/systemd/system/nginx.service.d/10-novuconstruct.conf
# The core vhosts bind to WireGuard addresses: nginx must start after the
# tunnels exist and after the firewall is loaded, so no port is ever served
# without nftables in front of it (scenario N12).
# NC_NGINX_SHARED=1 (nginx shared with NovuServer, T5.3): nc-provision installs
# this file without "Requires=" (nftables only in Wants=), so stopping nftables
# cannot take down the other vhosts; `nc-provision start` checks the firewall.
[Unit]
After=nftables.service wg-quick@wg-nc.service wg-quick@wg-nc-admin.service
Requires=nftables.service
Wants=wg-quick@wg-nc.service wg-quick@wg-nc-admin.service
