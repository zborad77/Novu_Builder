# Only the gateway instance holds the gateway HMAC keys (F3.4). The desktop and
# admin instances never see them. Generated by bin/nc-gen-secrets; rotation:
# docs/security/GATEWAY_CORE_CONTRACT.md "Rotace klíče".
[Service]
LoadCredential=NC_GATEWAY_HMAC_KEYS:/etc/novuconstruct/secrets/NC_GATEWAY_HMAC_KEYS
