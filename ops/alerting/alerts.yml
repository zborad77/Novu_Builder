groups:
  - name: novu_backend
    rules:

      # ── Availability ────────────────────────────────────────────────────────

      - alert: BackendDown
        expr: up{job="novu-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Novu backend is down"
          description: "The Python backend has been unreachable for more than 1 minute."

      - alert: WorkerDown
        expr: (novu_worker_monitoring_available == 1) and (novu_worker_alive == 0)
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Novu worker process is not running"
          description: "No worker heartbeat detected for 3+ minutes. Analysis jobs will queue up."

      # ── Error rates ─────────────────────────────────────────────────────────

      - alert: High5xxRate
        expr: |
          rate(http_requests_total{status_code=~"5..", job="novu-backend"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate"
          description: "More than 5% of requests are returning 5xx errors."

      - alert: High429Rate
        expr: |
          rate(http_requests_total{status_code="429", job="novu-backend"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High rate-limit (429) responses"
          description: "Possible brute-force or misconfigured client. Check account_limiter logs."

      # ── Latency ─────────────────────────────────────────────────────────────

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="novu-backend"}[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 response latency > 2s"
          description: "95th percentile response time has exceeded 2 seconds for 5 minutes."

      # ── Database ────────────────────────────────────────────────────────────

      - alert: DatabaseUnreachable
        expr: novu_db_alive == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database unreachable"
          description: "The /health/internal endpoint reports db=error."

      - alert: JobQueueBacklog
        expr: novu_queue_length > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Large analysis job backlog"
          description: "More than 50 jobs are waiting in the durable Redis queue for 10+ minutes."

      - alert: HighJobFailRate
        expr: novu_job_fail_rate > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High analysis job failure rate"
          description: "More than 25% of recently observed terminal analysis job outcomes are failing."

      - alert: StuckRunningJobs
        expr: novu_job_stuck_max_age_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Analysis job appears stuck"
          description: "The oldest running analysis job has been active for more than 15 minutes."

      # ── Queue — dead-letter, retry storm, heavy lane ────────────────────────

      - alert: DeadLetterQueueGrowing
        expr: novu_queue_dead_letter_active > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Jobs accumulating in dead-letter queue"
          description: "{{ $value }} jobs exhausted all retry attempts. Investigate novu_job_outcomes_total{status='dead_letter'} for root cause."
          runbook_url: "docs/monitoring_observability_audit_2026-04-06.md"

      - alert: RetryQueueSurge
        expr: |
          rate(novu_queue_scheduled_retry[10m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Retry queue growing rapidly — possible retry storm"
          description: "Retry queue is growing at >0.5/s over 10 minutes. Check AI provider status and novu_job_outcomes_total{status='failed'}."
          runbook_url: "docs/incident-rehearsal-scenare.md"

      - alert: HeavyQueueBacklog
        expr: novu_heavy_queue_length > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Heavy job queue (export/media) has large backlog"
          description: "{{ $value }} heavy jobs waiting for 15+ minutes. Export and media processing may be stalled."

      # ── Auth anomalies ───────────────────────────────────────────────────────

      - alert: AuthFailureSpike
        expr: |
          rate(novu_auth_failures_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated authentication failure rate"
          description: "Auth failures exceeding 0.5/s for 2 minutes. Possible brute-force or credential stuffing. Check novu_auth_failures_total by endpoint and reason."

      # ── Redis runtime ────────────────────────────────────────────────────────

      - alert: RedisRuntimeDegraded
        expr: novu_redis_runtime_degraded == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis runtime in degraded mode"
          description: "Worker heartbeat and queue operations running in degraded mode. Worker liveness signals may be stale."

      # ── Disk / storage ──────────────────────────────────────────────────────

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} /
           node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space below 10%"
          description: "Less than 10% free disk space on the root filesystem."

  # ── Backups, worker heartbeat and WireGuard (F9.1, F9.3) ──────────────────
  # Backup and WG metrics come from node_exporter's textfile collector, written by
  # deploy/linux/bin/nc-backup and deploy/linux/bin/nc-wg-metrics.
  - name: novu_operations
    rules:

      - alert: BackendTargetMissing
        expr: absent(up{job="novu-backend"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Novu backend is not scraped at all"
          description: "Prometheus has no novu-backend target; BackendDown cannot fire without it."

      - alert: WorkerHeartbeatUnknown
        expr: novu_worker_monitoring_available == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Worker heartbeat cannot be read"
          description: "The API cannot read worker heartbeats from Redis for 5+ minutes; the worker state is unknown and WorkerDown is blind."

      # A worker writes its heartbeat every 30 s; older than 90 s counts as stale and
      # the key expires after 120 s (app/platform/jobs/heartbeat.py). A worker that stops
      # beating while others still run is invisible to WorkerDown: its heartbeat first
      # turns stale (seen > alive), then disappears, so the fresh count drops below the
      # recent maximum. A graceful stop deletes the key and does not count as stale.
      - alert: WorkerHeartbeatStale
        expr: |
          novu_worker_monitoring_available == 1
            and on(instance, job)
          (
            novu_worker_seen_instances > novu_worker_alive_instances
              or
            novu_worker_alive_instances < max_over_time(novu_worker_alive_instances[15m])
          )
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Worker heartbeat is stale"
          description: "A worker instance stopped refreshing its heartbeat (older than 90 s) while monitoring can read Redis. Check systemctl status nc-worker and journalctl -u nc-worker."

      - alert: NcBackupFailed
        expr: nc_backup_last_run_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Off-host backup failed"
          description: "The last nc-backup run did not store and verify every part off-host. See journalctl -u nc-backup."

      - alert: NcBackupStale
        expr: time() - nc_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No successful off-host backup for more than 26 hours"
          description: "The nightly nc-backup has not succeeded since {{ $value | humanizeDuration }}."

      - alert: NcBackupMissing
        expr: absent(nc_backup_last_run_timestamp_seconds)
        for: 26h
        labels:
          severity: critical
        annotations:
          summary: "nc-backup has never reported"
          description: "No nc_backup metrics: nc-backup.timer is not enabled, /etc/novuconstruct/backup.env is missing or node_exporter does not read the textfile directory."

      - alert: WireGuardInterfaceDown
        expr: nc_wg_interface_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "WireGuard interface {{ $labels.interface }} is down"
          description: "{{ $labels.interface }} does not exist, is administratively down or wg show fails; desktop or admin access over WireGuard is lost."

      # nc-wg-metrics reports every interface in NC_WG_INTERFACES; a missing series means
      # the interface was dropped from the list or node_exporter does not read the file.
      - alert: WireGuardInterfaceNotMonitored
        expr: |
          absent(nc_wg_interface_up{interface="wg-nc"})
            or
          absent(nc_wg_interface_up{interface="wg-nc-admin"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "WireGuard interface {{ $labels.interface }} is not monitored"
          description: "No nc_wg_interface_up series for {{ $labels.interface }}: check NC_WG_INTERFACES in /etc/novuconstruct/monitoring.env, nc-wg-metrics.timer and the node_exporter textfile collector."

      # Up, but no handshake with any peer for longer than the limit configured in
      # NC_WG_HANDSHAKE_MAX_AGE / NC_WG_HANDSHAKE_MAX_AGE_OVERRIDES (0 disables it).
      # An interface without peers reports handshake 0 and therefore fires as well.
      - alert: WireGuardNoHandshake
        expr: |
          nc_wg_interface_up == 1
            and on(instance, job, interface)
          nc_wg_handshake_max_age_seconds > 0
            and on(instance, job, interface)
          (time() - nc_wg_interface_latest_handshake_timestamp_seconds)
            > on(instance, job, interface)
          nc_wg_handshake_max_age_seconds
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "WireGuard interface {{ $labels.interface }} has no recent handshake"
          description: "{{ $labels.interface }} is up, but no peer completed a handshake within the configured limit (nc_wg_handshake_max_age_seconds). Check the peers, UDP 51830/51831 and wg show {{ $labels.interface }}."

      - alert: WireGuardRequiredPeerStale
        expr: |
          nc_wg_peer_required == 1
            unless on(interface, peer)
          (time() - nc_wg_peer_latest_handshake_timestamp_seconds) < 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Required WireGuard peer without a fresh handshake"
          description: "Peer {{ $labels.peer }} on {{ $labels.interface }} has had no handshake for 5+ minutes."

      - alert: WireGuardMetricsStale
        expr: time() - node_textfile_mtime_seconds{file=~".*nc_wg\\.prom"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WireGuard metrics are not refreshed"
          description: "nc_wg.prom is older than 5 minutes; nc-wg-metrics.timer is not running."
