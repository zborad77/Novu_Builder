events {
    worker_connections 1024;
}

http {
    # ── Upload size limit (musí být >= MAX_UPLOAD_SIZE_MB v backendové konfiguraci) ──
    client_max_body_size 25M;

    # ── Upstream backend ────────────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ── Security headers aplikované na všechny odpovědi ─────────────────────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── /metrics — přístupný pouze z localhost a docker interní sítě ────────────
        # Prometheus scraper musí běžet na stejném hostu nebo v docker síti.
        # Veřejný přístup je zakázán (403).
        location = /metrics {
            allow 127.0.0.1;
            allow ::1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;

            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ── /api/v1/health/internal — pouze interní přístup ─────────────────────────
        location = /api/v1/health/internal {
            allow 127.0.0.1;
            allow ::1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;

            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ── Obecný proxy pro všechny ostatní requesty ────────────────────────────────
        location / {
            proxy_pass             http://backend;
            proxy_http_version     1.1;
            proxy_set_header       Connection        "";
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;

            # Timeouty — AI analýza může trvat až 3 min (180s v backendovém kódu)
            proxy_connect_timeout  10s;
            proxy_send_timeout     200s;
            proxy_read_timeout     200s;
        }
    }
}
