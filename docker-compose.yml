services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novu_builder
      POSTGRES_USER: novu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novu -d novu_builder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./python-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://novu:${POSTGRES_PASSWORD}@db:5432/novu_builder
      DATABASE_URL_SYNC: postgresql+psycopg://novu:${POSTGRES_PASSWORD}@db:5432/novu_builder
      DB_AUTO_CREATE_SCHEMA: "false"
      DB_SEED_ON_STARTUP: "false"
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Root .env.production is the authoritative source for the pilot runtime
      # profile. Even intentional single-node values must be explicit there.
      REDIS_FAILOVER_URLS: ${REDIS_FAILOVER_URLS}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${REDIS_SOCKET_CONNECT_TIMEOUT}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT}
      REDIS_HEALTH_CHECK_INTERVAL: ${REDIS_HEALTH_CHECK_INTERVAL}
      REDIS_RETRY_ATTEMPTS: ${REDIS_RETRY_ATTEMPTS}
      REDIS_RETRY_BACKOFF_BASE: ${REDIS_RETRY_BACKOFF_BASE}
      REDIS_RETRY_BACKOFF_CAP: ${REDIS_RETRY_BACKOFF_CAP}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN}
      RATE_LIMIT_ADMIN_WRITE: ${RATE_LIMIT_ADMIN_WRITE}
      RATE_LIMIT_ADMIN_SENSITIVE: ${RATE_LIMIT_ADMIN_SENSITIVE}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD}
      RATE_LIMIT_ANALYSIS_JOBS: ${RATE_LIMIT_ANALYSIS_JOBS}
      METRICS_AUTH_ENABLED: ${METRICS_AUTH_ENABLED}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN}
      WORKER_METRICS_ENABLED: ${WORKER_METRICS_ENABLED}
      WORKER_METRICS_HOST: ${WORKER_METRICS_HOST}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE}
      STORAGE_BACKEND: ${STORAGE_BACKEND}
      STORAGE_AUTHORITATIVE: ${STORAGE_AUTHORITATIVE}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_CDN_BASE_URL: ${S3_CDN_BASE_URL}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS}
      S3_READ_TIMEOUT_SECONDS: ${S3_READ_TIMEOUT_SECONDS}
      STORAGE_SIGNED_URL_TTL_SECONDS: ${STORAGE_SIGNED_URL_TTL_SECONDS}
      EXPORT_TTL_DAYS: ${EXPORT_TTL_DAYS}
      STORAGE_ROOT: /data/storage
      WORKER_HEALTH_PATH: /tmp/novu-worker-heartbeat.json
      AI_ANALYSIS_PROVIDER: ${AI_ANALYSIS_PROVIDER}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      WORKER_HEAVY_CONCURRENCY: ${WORKER_HEAVY_CONCURRENCY}
      WORKER_JOB_LEASE_TIMEOUT_SECONDS: ${WORKER_JOB_LEASE_TIMEOUT_SECONDS}
      WORKER_HEAVY_JOB_LEASE_TIMEOUT_SECONDS: ${WORKER_HEAVY_JOB_LEASE_TIMEOUT_SECONDS}
      WORKER_JOB_REAP_INTERVAL_SECONDS: ${WORKER_JOB_REAP_INTERVAL_SECONDS}
      WORKER_HEAVY_JOB_REAP_INTERVAL_SECONDS: ${WORKER_HEAVY_JOB_REAP_INTERVAL_SECONDS}
      READINESS_PROCESSING_GRACE_SECONDS: ${READINESS_PROCESSING_GRACE_SECONDS}
      ANALYSIS_QUEUE_MAX_DEPTH: ${ANALYSIS_QUEUE_MAX_DEPTH}
      HEAVY_QUEUE_MAX_DEPTH: ${HEAVY_QUEUE_MAX_DEPTH}
      ANALYSIS_JOB_MAX_ATTEMPTS: ${ANALYSIS_JOB_MAX_ATTEMPTS}
      ANALYSIS_RETRY_BACKOFF_BASE_SECONDS: ${ANALYSIS_RETRY_BACKOFF_BASE_SECONDS}
      ANALYSIS_RETRY_BACKOFF_MAX_SECONDS: ${ANALYSIS_RETRY_BACKOFF_MAX_SECONDS}
      ANALYSIS_JOBS_PER_TENANT_LIMIT: ${ANALYSIS_JOBS_PER_TENANT_LIMIT}
      WORKER_DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE}
      WORKER_DB_POOL_TIMEOUT: ${WORKER_DB_POOL_TIMEOUT}
      WORKER_INSTANCE_COUNT: ${WORKER_INSTANCE_COUNT}
      LOG_LEVEL: INFO
    volumes:
      # Kept only for local/non-prod compatibility. Production media storage is
      # expected to use STORAGE_BACKEND=s3, in which case this volume is ignored.
      - storage_data:/data/storage
    healthcheck:
      # python:3.12-slim has no curl; use stdlib urllib instead
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/api/v1/alive', timeout=5) or sys.exit(1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost/ 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./python-backend
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.worker.runner"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://novu:${POSTGRES_PASSWORD}@db:5432/novu_builder
      DATABASE_URL_SYNC: postgresql+psycopg://novu:${POSTGRES_PASSWORD}@db:5432/novu_builder
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_FAILOVER_URLS: ${REDIS_FAILOVER_URLS}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${REDIS_SOCKET_CONNECT_TIMEOUT}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT}
      REDIS_HEALTH_CHECK_INTERVAL: ${REDIS_HEALTH_CHECK_INTERVAL}
      REDIS_RETRY_ATTEMPTS: ${REDIS_RETRY_ATTEMPTS}
      REDIS_RETRY_BACKOFF_BASE: ${REDIS_RETRY_BACKOFF_BASE}
      REDIS_RETRY_BACKOFF_CAP: ${REDIS_RETRY_BACKOFF_CAP}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN}
      RATE_LIMIT_ADMIN_WRITE: ${RATE_LIMIT_ADMIN_WRITE}
      RATE_LIMIT_ADMIN_SENSITIVE: ${RATE_LIMIT_ADMIN_SENSITIVE}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD}
      RATE_LIMIT_ANALYSIS_JOBS: ${RATE_LIMIT_ANALYSIS_JOBS}
      METRICS_AUTH_ENABLED: ${METRICS_AUTH_ENABLED}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN}
      WORKER_METRICS_ENABLED: ${WORKER_METRICS_ENABLED}
      WORKER_METRICS_HOST: ${WORKER_METRICS_HOST}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE}
      STORAGE_BACKEND: ${STORAGE_BACKEND}
      STORAGE_AUTHORITATIVE: ${STORAGE_AUTHORITATIVE}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_CDN_BASE_URL: ${S3_CDN_BASE_URL}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS}
      S3_READ_TIMEOUT_SECONDS: ${S3_READ_TIMEOUT_SECONDS}
      STORAGE_SIGNED_URL_TTL_SECONDS: ${STORAGE_SIGNED_URL_TTL_SECONDS}
      EXPORT_TTL_DAYS: ${EXPORT_TTL_DAYS}
      STORAGE_ROOT: /data/storage
      WORKER_HEALTH_PATH: /tmp/novu-worker-heartbeat.json
      AI_ANALYSIS_PROVIDER: ${AI_ANALYSIS_PROVIDER}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      WORKER_HEAVY_CONCURRENCY: ${WORKER_HEAVY_CONCURRENCY}
      WORKER_JOB_LEASE_TIMEOUT_SECONDS: ${WORKER_JOB_LEASE_TIMEOUT_SECONDS}
      WORKER_HEAVY_JOB_LEASE_TIMEOUT_SECONDS: ${WORKER_HEAVY_JOB_LEASE_TIMEOUT_SECONDS}
      WORKER_JOB_REAP_INTERVAL_SECONDS: ${WORKER_JOB_REAP_INTERVAL_SECONDS}
      WORKER_HEAVY_JOB_REAP_INTERVAL_SECONDS: ${WORKER_HEAVY_JOB_REAP_INTERVAL_SECONDS}
      READINESS_PROCESSING_GRACE_SECONDS: ${READINESS_PROCESSING_GRACE_SECONDS}
      ANALYSIS_QUEUE_MAX_DEPTH: ${ANALYSIS_QUEUE_MAX_DEPTH}
      HEAVY_QUEUE_MAX_DEPTH: ${HEAVY_QUEUE_MAX_DEPTH}
      ANALYSIS_JOB_MAX_ATTEMPTS: ${ANALYSIS_JOB_MAX_ATTEMPTS}
      ANALYSIS_RETRY_BACKOFF_BASE_SECONDS: ${ANALYSIS_RETRY_BACKOFF_BASE_SECONDS}
      ANALYSIS_RETRY_BACKOFF_MAX_SECONDS: ${ANALYSIS_RETRY_BACKOFF_MAX_SECONDS}
      ANALYSIS_JOBS_PER_TENANT_LIMIT: ${ANALYSIS_JOBS_PER_TENANT_LIMIT}
      WORKER_DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE}
      WORKER_DB_POOL_TIMEOUT: ${WORKER_DB_POOL_TIMEOUT}
      WORKER_INSTANCE_COUNT: ${WORKER_INSTANCE_COUNT}
      LOG_LEVEL: INFO
    volumes:
      # Kept only for local/non-prod compatibility. Production media storage is
      # expected to use STORAGE_BACKEND=s3, in which case this volume is ignored.
      - storage_data:/data/storage
    expose:
      - "${WORKER_METRICS_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -m app.worker.healthcheck || (echo 'worker unhealthy; terminating PID 1 for restart' >&2; kill -TERM 1; sleep 1; exit 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
  storage_data:
  redis_data:
