services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novu_builder
      POSTGRES_USER: novu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novu -d novu_builder"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./python-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://novu:${POSTGRES_PASSWORD}@db:5432/novu_builder
      DATABASE_URL_SYNC: postgresql+psycopg://novu:${POSTGRES_PASSWORD}@db:5432/novu_builder
      DB_AUTO_CREATE_SCHEMA: "false"
      DB_SEED_ON_STARTUP: "false"
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_ROOT: /data/storage
      AI_ANALYSIS_PROVIDER: ${AI_ANALYSIS_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: INFO
    volumes:
      - storage_data:/data/storage
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  storage_data:
  redis_data:
