services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novu_builder
      POSTGRES_USER: novu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novu -d novu_builder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./python-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://novu:${POSTGRES_PASSWORD}@db:5432/novu_builder
      DATABASE_URL_SYNC: postgresql+psycopg://novu:${POSTGRES_PASSWORD}@db:5432/novu_builder
      DB_AUTO_CREATE_SCHEMA: "false"
      DB_SEED_ON_STARTUP: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_ROOT: /data/storage
      AI_ANALYSIS_PROVIDER: ${AI_ANALYSIS_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: INFO
    volumes:
      - storage_data:/data/storage
    healthcheck:
      # python:3.12-slim has no curl; use stdlib urllib instead
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/api/v1/alive', timeout=5) or sys.exit(1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost/ 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./python-backend
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.worker.runner"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://novu:${POSTGRES_PASSWORD}@db:5432/novu_builder
      DATABASE_URL_SYNC: postgresql+psycopg://novu:${POSTGRES_PASSWORD}@db:5432/novu_builder
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_ROOT: /data/storage
      AI_ANALYSIS_PROVIDER: ${AI_ANALYSIS_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: INFO
    volumes:
      - storage_data:/data/storage

volumes:
  postgres_data:
  storage_data:
  redis_data:
