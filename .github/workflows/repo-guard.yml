name: Repo Guard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on forbidden files
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning tracked files for forbidden patterns..."

          # Real env files stay forbidden (.env, .env.production, .env.local, .env/...).
          # Committed templates are explicitly allowed: they carry key NAMES only, never
          # values, and the deployment docs require them to be in the repo. The allow-list
          # is a suffix match applied after the forbidden match, so a file must be named
          # *.example / *.template to escape — `.env.production` still fails.
          forbidden="$(git ls-files \
            | grep -E '(^|/)\.env($|\.|/)|(^|/).*\.db$|(^|/).*\.sqlite3$|(^|/).*\.log$|(^|/)tmp_.*|(^|/)\.debug_.*|(^|/)\.codex_tmp_validation/|(^|/)artifacts/|(^|/)pytest-local/|(^|/)tmp_pytest/|(^|/)tmp_pytest_orch/' \
            | grep -vE '\.(example|template)$' \
            || true)"

          if [ -n "$forbidden" ]; then
            echo "Forbidden tracked files detected:"
            echo "$forbidden"
            exit 1
          fi

          echo "Repo guard passed."

      - name: Fail on secrets-like files
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)nginx/certs/.*\.pem$' >/dev/null 2>&1; then
            echo "Tracked PEM certificate detected."
            exit 1
          fi

          echo "Secret-file guard passed."
