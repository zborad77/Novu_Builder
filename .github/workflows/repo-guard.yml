name: Repo Guard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail on forbidden files
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning tracked files for forbidden patterns..."

          forbidden="$(git ls-files | grep -E '(^|/)\.env($|\.|/)|(^|/).*\.db$|(^|/).*\.sqlite3$|(^|/).*\.log$|(^|/)tmp_.*|(^|/)\.debug_.*|(^|/)\.codex_tmp_validation/|(^|/)artifacts/|(^|/)pytest-local/|(^|/)tmp_pytest/|(^|/)tmp_pytest_orch/' || true)"

          if [ -n "$forbidden" ]; then
            echo "Forbidden tracked files detected:"
            echo "$forbidden"
            exit 1
          fi

          echo "Repo guard passed."

      - name: Fail on secrets-like files
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)nginx/certs/.*\.pem$' >/dev/null 2>&1; then
            echo "Tracked PEM certificate detected."
            exit 1
          fi

          echo "Secret-file guard passed."

      - name: Enforce orchestration protected-file checklist
        run: python scripts/check_orchestration_protected_changes.py
