name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # R-28: linting, typing, SAST — runs independently of the test job (fast feedback)
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-backend/requirements.txt
            python-backend/requirements-dev.txt

      # Runtime deps are installed too: with them missing, `ignore_missing_imports`
      # degrades every third-party symbol to Any and mypy silently stops checking
      # most of app/. Installing both sets makes CI's mypy as strict as the local run.
      - name: Install runtime + dev dependencies
        run: pip install -r python-backend/requirements.txt -r python-backend/requirements-dev.txt

      - name: Ruff (style + unused imports)
        working-directory: python-backend
        run: ruff check app/

      - name: Mypy (type check — full app/)
        working-directory: python-backend
        run: mypy app/

      - name: Bandit (SAST — medium severity and above)
        working-directory: python-backend
        run: bandit -r app/ -ll -ii

      - name: pip-audit (known CVE scan on production dependencies)
        working-directory: python-backend
        run: pip-audit -r requirements.txt --progress-spinner=off

  # -------------------------------------------------------------------------
  # Web frontend — typecheck + ESLint boundaries + dependency-cruiser gate
  # Must pass before any merge. Catches import boundary violations at PR time.
  # -------------------------------------------------------------------------
  web-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint (boundaries + no-raw-fetch)
        run: npm run lint

      - name: dependency-cruiser (architecture gate)
        run: npm run dep-cruise

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/novu_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/novu_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      STORAGE_ROOT: /tmp/novu-ci-storage
      AI_ANALYSIS_PROVIDER: mock
      LOG_LEVEL: WARNING
      # REDIS_URL intentionally unset — test-redis-connection.py skips when missing
      # SENTRY_DSN intentionally unset — error monitoring off in CI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-backend/requirements.txt
            python-backend/requirements-dev.txt

      # Both sets, pinned. pytest / pytest-asyncio / pytest-cov are declared in
      # requirements-dev.txt; installing them ad-hoc (or relying on a transitive
      # pull) is what left pytest-asyncio missing while pytest.ini requires
      # asyncio_mode = auto.
      - name: Install runtime + dev dependencies
        run: pip install -r python-backend/requirements.txt -r python-backend/requirements-dev.txt

      # --- No server needed ---

      - name: Import & startup verification
        run: python scripts/verify_import_startup.py

      - name: Environment check
        run: python scripts/test-env.py

      - name: Pytest
        working-directory: python-backend
        run: python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=40

      # --- Start backend ---

      - name: Start backend
        run: |
          cd python-backend
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/alive > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              exit 0
            fi
            echo "  waiting... (${i}s)"
            sleep 1
          done
          echo "Backend did not start in 30s"
          exit 1

      # --- Live checks ---

      - name: DB connectivity
        run: python scripts/test-db-connection.py

      - name: Post-deploy verification bundle
        run: python scripts/verify_deploy.py --base-url http://127.0.0.1:8000

      - name: API contracts
        run: python scripts/test-api-contracts.py --url http://127.0.0.1:8000

      - name: Auth & validation contracts
        run: python scripts/test-auth-validation.py --url http://127.0.0.1:8000

      - name: Business flow (create case → analysis → verify)
        run: python scripts/test-business-flow.py --url http://127.0.0.1:8000

  # ── Release gate ─────────────────────────────────────────────────────────────
  # Single required status check for branch protection.
  # Aggregates lint + web-lint + test — fails if any dependency failed or was
  # skipped. Always runs so GitHub always receives a conclusive status.
  orchestration-release-gate:
    needs: [lint, web-lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Gate — all required checks passed
        run: |
          if [[ "${{ needs.lint.result }}"     != "success" ||
                "${{ needs.web-lint.result }}" != "success" ||
                "${{ needs.test.result }}"     != "success" ]]; then
            echo "orchestration-release-gate: FAILED"
            echo "  lint:     ${{ needs.lint.result }}"
            echo "  web-lint: ${{ needs.web-lint.result }}"
            echo "  test:     ${{ needs.test.result }}"
            exit 1
          fi
          echo "orchestration-release-gate: PASSED"
