[project]
name = "nc-gateway"
version = "0.1.0"
description = "NovuConstruct Web Gateway / BFF (NC-007 etapa 1)"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # české texty v komentářích a docstringech

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"tests_e2e/**" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["nc_gateway"]
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
