[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# F = pyflakes (unused imports, undefined names)
# E = pycodestyle errors (import order, etc.)
# W = pycodestyle warnings
select = ["F", "E", "W"]
# E501 = line too long (handled by formatter, not linter)
ignore = ["E501"]

[tool.mypy]
# C6: full app/ coverage with lenient settings — catches obvious errors without
# requiring strict null-safety or full annotation coverage.
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
# Do not require type annotations on every function (too invasive for existing code)
disallow_untyped_defs = false
# Allow Any where types can't be inferred
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["app.core.*", "app.api.routes.auth"]
# Security-critical modules — stricter checks encouraged here
disallow_untyped_defs = false
